name: Package
on:
  push:
    branches:
      - dev
      - stable
jobs:
  package:
    # Production pipeline: Rust native Windows app only.
    # The Electron codebase is stale legacy code — it is not built,
    # signed, or released here.
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Add commit to version
        if: github.ref_name == 'dev'
        run: cat <<< $(jq --arg ver "$(jq -r '.version' package.json)-$(git rev-parse --short HEAD)" '.version = $ver' package.json) > package.json
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path native/Cargo.toml
        shell: pwsh

      - name: Build native installer
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --accept-source-agreements --accept-package-agreements
          pwsh -NoProfile -File native/installer/build-installer.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            native/installer/stage/remcord.exe
            native/installer/dist/*.exe

  release:
    runs-on: windows-latest
    needs:
      - package
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-files

      - name: Create release
        if: github.ref_name == 'dev'
        uses: ncipollo/release-action@v1
        with:
          name: Rolling Dev Build
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          body: "Rolling development build of the native Rust app compiled from the dev branch on every commit."
          draft: false
          tag: devbuild
          artifacts: release-files/**/*

      - name: Create release
        if: github.ref_name == 'stable'
        uses: ncipollo/release-action@v1
        with:
          name: Stable Release Draft
          prerelease: false
          tag: stable
          draft: true
          artifacts: release-files/**/*
