name: Update metainfo on release

on:
    release:
        types:
            - published
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        # Windows-only for now.
        runs-on: windows-latest
        env:
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            # Must track package.json engines (>=26). Node 22 breaks
            # postinstall (electron-builder install-app-deps) and the build.
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install dependencies
              run: pnpm i --frozen-lockfile

            - name: Update metainfo
              run: pnpm updateMeta

            - name: Commit and merge in changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  gh release upload "${{ github.event.release.tag_name }}" meta/app.remcord.Remcord.metainfo.xml

                  git add meta/app.remcord.Remcord.metainfo.xml
                  git commit -m "metainfo: add entry for ${{ github.event.release.tag_name }}"
                  git push origin HEAD:dev
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
