name: Publish to WinGet
on:
    release:
        types: [released]
jobs:
    publish:
        runs-on: windows-latest
        steps:
            # identifier must match electron-builder.ts appx.applicationId
            # (rawknee-69.Remcord). installers-regex matches the artifactName
            # from electron-builder.ts: Remcord-<version>-win-<arch>.exe
            # (win-x64 / win-arm64 / win-ia32 from the NSIS target).
            - uses: vedantmgoyal9/winget-releaser@main
              with:
                identifier: rawknee-69.Remcord
                installers-regex: '-win-\w+\.exe$'
                token: ${{secrets.PUBLIC_REPO_READ}}
