name: Publish to WinGet
on:
    release:
        types: [released]
jobs:
    publish:
        runs-on: windows-latest
        steps:
            # identifier stays rawknee-69.Remcord so the existing WinGet
            # package updates in place. installers-regex matches the native
            # Rust installer asset: Remcord-Setup-<version>.exe
            - uses: vedantmgoyal9/winget-releaser@main
              with:
                identifier: rawknee-69.Remcord
                installers-regex: '-Setup-.*\.exe$'
                token: ${{secrets.PUBLIC_REPO_READ}}
