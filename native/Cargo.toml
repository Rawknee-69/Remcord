[package]
name = "remcord"
version = "1.3.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Remcord is a custom client designed to enhance your Discord experience while keeping everything lightweight."

[package.metadata.winres]
# Display name differs in case from the package/exe name (`remcord`).
ProductName = "Remcord"
OriginalFilename = "remcord.exe"
# User-facing Windows process label (Task Manager, etc.): exactly the short
# product name. This deliberately does NOT mirror the package `description`
# sentence — Windows derives the Task Manager display name from
# FileDescription, and the long sentence truncated into noise there.
FileDescription = "Remcord"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Artifact identity for mods whose published bundle carries no build header
# (Shelter). Already present in the lockfile as a transitive dependency.
sha2 = "0.10.9"
ureq = "2.12.1"
tao = "0.37.1"
wry = "0.57.0"
notify = "8"
http = "1.5"
# Backup export only (D4-1): deterministic ZIP creation for `backup.save`.
# Deflate only — no bzip2/lzma/zstd/ppmd backends, no external utilities.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Windows WebView2 COM interop for response header interception (CSP modification)
webview2-com = "0.39"
# Direct loader API for Evergreen Runtime presence detection
# (GetAvailableCoreWebView2BrowserVersionString; the safe wrapper above
# does not expose it). Pinned to the same 0.39 line.
webview2-com-sys = "0.39"
# URL parsing for the remcord:// protocol
url = "2.5"
# Percent encoding/decoding for the remcord:// protocol
percent-encoding = "2.3"
# Error handling for the remcord:// protocol
thiserror = "1.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1.0.151"
# Content identity for the embedded settings plugin artifact (same version
# as the main dependency; build scripts cannot use regular dependencies).
sha2 = "0.10.9"
# Windows executable metadata (product name, version, icon) for release
# identity. Only invoked on Windows targets (see build.rs).
winres = "0.1"
