[package]
name = "legcord-native-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Artifact identity for mods whose published bundle carries no build header
# (Shelter). Already present in the lockfile as a transitive dependency.
sha2 = "0.10.9"
ureq = "2.12.1"
tao = "0.37.1"
wry = "0.57.0"
notify = "8"
http = "1.5"
# Windows WebView2 COM interop for response header interception (CSP modification)
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }

[build-dependencies]
serde_json = "1.0.151"
